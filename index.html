<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8eef0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ciclo di Kendra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Karla:wght@400;500;700&display=swap">
<style>
html, body { margin: 0; min-height: 100% }
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
img { max-width: 100% }
[hidden] { display: none !important }
</style>
<style>
/* Layout: app a schede (in basso su telefono, a sinistra su computer). Rosa cipria, malva per ovulazione e giorni fertili. */
:root {
  --bg: #f8eef0;
  --surface: #fffcfd;
  --line: #ead6dc;
  --fg: #3a2a33;
  --muted: #8c7480;
  --title: #6e4a86;
  --period: #c9718c;
  --period-ink: #b05a76;
  --period-soft: #f6e1e7;
  --accent: #8e6bb8;
  --fert-soft: #ece4f5;
  --late: #b8506b;
  --late-soft: #f6dfe5;
  --chip: #f4e8ec;
  --tabs: #f1dfe5;
  --ok: #5f9a7a;
  --font-display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-body: "Karla", "Segoe UI", system-ui, sans-serif;
  --r: 12px;
}

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.num { font-variant-numeric: tabular-nums }

.app { display: grid; grid-template-columns: 1fr; min-height: 100%; padding-bottom: 76px }
.main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 24px; max-width: 720px; width: 100%; margin: 0 auto; display: grid; gap: 16px; align-content: start }

/* Navigazione */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--tabs); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)) }
.tab { background: none; border: 0; border-radius: 10px; padding: 6px 2px; display: grid; justify-items: center; gap: 2px; font-size: 11.5px; color: var(--muted) }
.tab svg { width: 22px; height: 22px }
.tab[aria-current="page"] { color: var(--title); background: var(--surface); font-weight: 700 }
.brand { display: none }
@media (min-width: 860px) {
  .app { grid-template-columns: 220px 1fr; padding-bottom: 0 }
  .tabs { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; border-top: 0; border-right: 1px solid var(--line);
    grid-template-columns: 1fr; align-content: start; gap: 4px; padding: 20px 12px; padding-left: max(12px, env(safe-area-inset-left, 0px)) }
  .tab { grid-auto-flow: column; justify-content: start; gap: 10px; font-size: 15px; padding: 9px 12px }
  .brand { display: block; font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 26px; color: var(--title); padding: 0 12px 16px; line-height: 1.05 }
  .main { padding-block: 24px 40px }
}

/* Testata */
.top { display: flex; align-items: center; gap: 8px; padding-block: 4px }
.top h1 { font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: clamp(28px, 7vw, 36px); color: var(--title); margin: 0; flex: 1; min-width: 0; line-height: 1.05; text-wrap: balance }
.top h1 small { display: block; font-family: var(--font-body); font-style: normal; font-weight: 500; font-size: 13px; color: var(--muted); letter-spacing: .02em; margin-top: 2px }
.iconbtn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; padding: 0 }
.iconbtn svg { width: 18px; height: 18px }
.iconbtn:disabled { opacity: .35; cursor: default }
.todaybtn { height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; font-size: 13.5px; font-weight: 500 }

/* Blocchi */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0 }
.panel h2 { font-family: var(--font-display); font-weight: 600; font-size: 23px; margin: 0; line-height: 1.15; color: var(--fg); text-wrap: balance }
.panel h2 small { font-family: var(--font-body); font-weight: 500; font-size: 13px; color: var(--muted); margin-left: 6px }
.panel p { margin: 0 }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 700; margin: 0 }
.empty { color: var(--muted); font-size: 14px; margin: 0 }
.btn { min-height: 46px; border: 0; border-radius: 10px; padding: 0 18px; background: var(--period); color: #fff; font-weight: 700; font-size: 15px; flex: 0 0 auto }
.btn.block { width: 100% }
.btn.ghost { background: var(--chip); color: var(--fg) }
.btn.violet { background: var(--accent) }
.btn:disabled { opacity: .5 }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; text-decoration: underline; font-size: 14px }
.actions { display: flex; flex-wrap: wrap; gap: 8px }
.actions .btn { flex: 1 1 140px }

.field { display: grid; gap: 4px; min-width: 0 }
.field label { font-size: 13px; color: var(--muted); font-weight: 500 }
input, select, textarea { width: 100%; min-height: 44px; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 0 12px; min-width: 0 }
textarea { padding: 10px 12px; min-height: 76px; resize: vertical }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px }

/* Anello del ciclo */
.hero { display: grid; justify-items: center; gap: 10px; padding-block: 18px }
.ring { position: relative; width: min(230px, 70vw); aspect-ratio: 1; max-width: 100% }
.ring svg { width: 100%; height: 100%; display: block }
.ring .in { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 2px; padding: 0 24px }
.ring .lab { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-weight: 700 }
.ring .big { font-family: var(--font-display); font-weight: 600; font-size: 50px; line-height: .95; color: var(--title); font-variant-numeric: lining-nums }
.ring .big.late { color: var(--late) }
.ring .big.per { color: var(--period-ink) }
.ring .sub { font-size: 13px; color: var(--fg) }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--chip); color: var(--fg); text-align: center }
.pill.late { background: var(--late-soft); color: var(--late) }
.pill.per { background: var(--period-soft); color: var(--period-ink) }
.pill.fert { background: var(--fert-soft); color: var(--accent) }
.facts { display: grid; gap: 0; margin: 0 }
.facts div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14.5px }
.facts div:first-child { border-top: 0; padding-top: 0 }
.facts dt { color: var(--muted) }
.facts dd { margin: 0; font-weight: 700; text-align: right }
.facts dd small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px }
.note { border-radius: var(--r); padding: 12px 14px; background: var(--late-soft); color: var(--fg); font-size: 14px; display: grid; gap: 6px }
.note.violet { background: var(--fert-soft) }
.note p { margin: 0 }
.note b { color: var(--late) }
.note.violet b { color: var(--accent) }

/* Consigli */
.tip { display: grid; gap: 4px; padding: 12px 0; border-top: 1px solid var(--line) }
.tip:first-of-type { border-top: 0; padding-top: 0 }
.tip h3 { margin: 0; font-size: 14.5px; color: var(--accent); font-weight: 700 }
.tip p { margin: 0; font-size: 14.5px }
.tip .doc { font-size: 13px; color: var(--late) }
details.lib { border-top: 1px solid var(--line); padding: 10px 0 }
details.lib:first-of-type { border-top: 0 }
details.lib summary { cursor: pointer; font-weight: 700; list-style-position: outside }
details.lib ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px }
.freq { display: grid; gap: 8px }
.freq div { display: grid; grid-template-columns: minmax(0, 9em) 1fr auto; gap: 10px; align-items: center; font-size: 14px }
.freq .t { height: 9px; background: var(--chip); border-radius: 99px; overflow: hidden }
.freq .t i { display: block; height: 100%; background: var(--period); border-radius: 99px }
.freq small { color: var(--muted); grid-column: 1 / -1; margin-top: -6px; font-size: 12.5px }

/* Calendario */
.monthbar { display: flex; align-items: center; gap: 8px }
.monthbar h2 { flex: 1 }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px 2px; text-align: center }
.cal .dow { font-size: 11.5px; color: var(--muted); font-weight: 700; padding-bottom: 2px }
.cal .d { position: relative; width: min(42px, 100%); aspect-ratio: 1; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; font-size: 14.5px; border: 0; background: none; padding: 0; font-variant-numeric: tabular-nums }
.cal .d.per { background: var(--period); color: #fff; font-weight: 700 }
.cal .d.pred { box-shadow: inset 0 0 0 2px var(--period); color: var(--period-ink); font-weight: 700; background: repeating-linear-gradient(45deg, transparent 0 4px, var(--period-soft) 4px 7px) }
.cal .d.fert { background: var(--fert-soft); color: var(--accent); font-weight: 500 }
.cal .d.ovu { background: var(--accent); color: #fff; font-weight: 700 }
.cal .d.today { outline: 2px solid var(--fg); outline-offset: 2px }
.cal .d.future { opacity: .92 }
.cal .d .dot { position: absolute; bottom: 3px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--fg); opacity: .55 }
.cal .d.per .dot, .cal .d.ovu .dot { background: #fff; opacity: .9 }
.cal .d .badge { position: absolute; top: -7px; right: -7px; background: var(--late); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 8px; line-height: 1.4 }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.legend i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex: none }
.list { list-style: none; margin: 0; padding: 0; display: grid }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0 }
.row:first-child { border-top: 0; padding-top: 0 }
.row .txt { flex: 1; min-width: 0; overflow-wrap: anywhere }
.row .txt small { display: block; color: var(--muted); font-size: 13px }
.row .val { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums }
.sw { width: 12px; height: 12px; border-radius: 50%; flex: none }
.del { border: 0; background: none; color: var(--muted); width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; flex: 0 0 auto; padding: 0 }
.del:hover { color: var(--late); background: var(--bg) }
.del svg { width: 16px; height: 16px }

/* Sintomi */
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chip { min-height: 38px; padding: 0 14px; border-radius: 999px; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg) }
.chip[aria-pressed="true"] { background: var(--period); border-color: var(--period); color: #fff; font-weight: 700 }
.chips.violet .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent) }
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 6px }
.seg button { min-height: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 13.5px; padding: 0 6px }
.seg button[aria-pressed="true"] { background: var(--period); border-color: var(--period); color: #fff; font-weight: 700 }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14.5px }
.toggle:first-child { border-top: 0 }
.toggle small { display: block; color: var(--muted); font-size: 12.5px }
.switch { width: 48px; height: 28px; border-radius: 99px; border: 0; background: var(--line); position: relative; flex: none; padding: 0 }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2) }
.switch[aria-checked="true"] { background: var(--accent) }
.switch[aria-checked="true"]::after { left: 23px }
@media (prefers-reduced-motion: no-preference) { .switch::after { transition: left .15s } }

/* Foglio in basso */
.sheet { position: fixed; inset: 0; z-index: 30; display: grid; align-items: end; justify-items: center; background: rgba(58,42,51,.35) }
.sheet .box { background: var(--surface); width: 100%; max-width: 520px; border-radius: 18px 18px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; max-height: 88vh; overflow: auto }
@media (min-width: 620px) { .sheet { align-items: center } .sheet .box { border-radius: 18px } }
.sheet h3 { margin: 0; font-family: var(--font-display); font-size: 26px; font-weight: 600; color: var(--title) }
.sheet .status { display: flex; flex-wrap: wrap; gap: 6px }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--surface); padding: 10px 14px; border-radius: 10px; display: flex; gap: 14px; align-items: center; z-index: 40; font-size: 14px; width: max-content; max-width: calc(100% - 32px) }
.toast button { background: none; border: 0; color: inherit; font-weight: 700; text-decoration: underline }
@media (min-width: 860px) { .toast { bottom: 24px } }

.login { min-height: 100vh; display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px }
.login form { width: 100%; max-width: 360px; display: grid; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 24px }
.login h1 { font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 38px; color: var(--title); margin: 0; line-height: 1 }
.login p { margin: 0; color: var(--muted); font-size: 14px }
.login .err { color: var(--late) }
.sync { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok) }
.sync[data-s="saving"]::before { background: #e3a13a }
.sync[data-s="error"]::before { background: var(--late) }
.hours { display: flex; flex-wrap: wrap; gap: 6px }
.hour { height: 36px; min-width: 56px; padding: 0 10px; border: 1px solid var(--line); border-radius: 99px; background: var(--bg); font-size: 13px; font-variant-numeric: tabular-nums }
.hour[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent) }
.small { font-size: 13px; color: var(--muted) }
</style>
</head>
<body>
<section class="login" id="login" hidden>
  <form id="f-login">
    <h1>Ciclo di Kendra</h1>
    <p>Accedi con la tua email e la tua password.</p>
    <div class="field"><label for="l-email">Email</label><input id="l-email" type="email" required autocomplete="username"></div>
    <div class="field"><label for="l-pass">Password</label><input id="l-pass" type="password" required autocomplete="current-password"></div>
    <button class="btn" id="l-btn">Accedi</button>
    <p class="err" id="l-err" hidden></p>
  </form>
</section>

<div class="app" id="app" hidden>
  <nav class="tabs" id="tabs" aria-label="Sezioni">
    <div class="brand">Ciclo<br>di Kendra</div>
  </nav>
  <main class="main" id="view"></main>
</div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="box" id="sheetbox"></div></div>
<div class="toast" id="toast" hidden><span id="toastmsg"></span><button id="undo">Annulla</button></div>

<script src="supabase.js"></script>
<script src="config.js"></script>
<script>
(function () {
  // Dati separati dalle altre app: chiave locale, login e tabella propri.
  const KEY = 'ciclo-kendra-v1';
  const TABLE = 'ciclo_kendra';
  const APP = 'ciclo';
  const ICON = {
    oggi: '<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 8 8"/><circle cx="12" cy="12" r="2.2"/>',
    calendario: '<path d="M4 5h16v15H4zM4 10h16M9 3v4M15 3v4"/><circle cx="9" cy="14.5" r="1"/><circle cx="15" cy="14.5" r="1"/>',
    sintomi: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
    consigli: '<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
    opzioni: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'
  };
  const TABS = [['oggi', 'Oggi'], ['calendario', 'Calendario'], ['sintomi', 'Sintomi'], ['consigli', 'Consigli'], ['opzioni', 'Opzioni']];
  const svg = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
  const X = svg('<path d="M6 6l12 12M18 6L6 18"/>');
  const PREV = svg('<path d="M15 6l-6 6 6 6"/>');
  const NEXT = svg('<path d="M9 6l6 6-6 6"/>');

  // ---------- date (sempre stringhe AAAA-MM-GG, calcoli in UTC per evitare l'ora legale) ----------
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const utc = (s) => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const diff = (a, b) => Math.round((utc(b) - utc(a)) / 86400000);
  const addDays = (s, n) => new Date(utc(s) + n * 86400000).toISOString().slice(0, 10);
  const todayIso = () => iso(new Date());
  const monthStart = (s) => s.slice(0, 8) + '01';
  const addMonths = (s, n) => { const d = parse(monthStart(s)); d.setMonth(d.getMonth() + n); return iso(d); };
  const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);
  const fmtMonth = (s) => cap(parse(monthStart(s)).toLocaleDateString('it-IT', { month: 'long', year: 'numeric' }));
  const fmtLong = (s) => parse(s).toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
  const fmtDM = (s) => parse(s).toLocaleDateString('it-IT', { day: 'numeric', month: 'long' });
  const fmtDMs = (s) => parse(s).toLocaleDateString('it-IT', { day: 'numeric', month: 'short' }).replace('.', '');
  const fmtWDM = (s) => parse(s).toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' }).replace(/\./g, '');
  const giorni = (n) => `${n} ${n === 1 ? 'giorno' : 'giorni'}`;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  const $ = (id) => document.getElementById(id);
  const avg = (a) => a.reduce((x, y) => x + y, 0) / a.length;

  // ---------- contenuti ----------
  const SINTOMI = {
    crampi: { label: 'Crampi', tips: [
      'Una borsa dell\'acqua calda sulla pancia o sulla schiena per 15-20 minuti rilassa i muscoli.',
      'Una tisana allo zenzero o alla camomilla aiuta, e anche una camminata leggera riduce i crampi.',
      'Se il dolore è forte, un antidolorifico da banco come l\'ibuprofene funziona meglio se lo prendi appena iniziano, seguendo il foglietto.'],
      doc: 'Se i crampi ti impediscono di fare le cose di tutti i giorni o non passano con gli antidolorifici, parlane con la ginecologa.' },
    testa: { label: 'Mal di testa', tips: [
      'Bevi due bicchieri d\'acqua: spesso il mal di testa del ciclo peggiora con poca acqua.',
      'Riposa qualche minuto al buio e lontano dallo schermo, con un panno fresco sulla fronte.',
      'Mandorle, banane e cioccolato fondente contengono magnesio, che aiuta con il mal di testa del ciclo.'],

  const FASE_STAT = { mestruale: 'durante il ciclo', fertile: 'nei giorni fertili', premestruale: 'nei giorni prima del ciclo', altro: 'negli altri giorni', ritardo: 'nei giorni di ritardo' };

  // ---------- dati ----------
  // periods: [{ id, start, end? }]  logs: { 'AAAA-MM-GG': { sym: [], mood, flow, sex, pill, weight, note } }
  function emptyData() {
    return { periods: [], baseCycle: 28, basePeriod: 5, logs: {}, pillola: false,
      notifiche: { ora: 9, prima: true, giorno: true, ritardo: true, fine: true, fertile: true, ovulazione: true, sintomi: false, oraSintomi: 21 } };
  }
  function normalize(d) {
    const e = emptyData();
    const out = Object.assign(e, d || {});
    out.notifiche = Object.assign(emptyData().notifiche, (d && d.notifiche) || {});
    out.periods = (out.periods || []).filter((p) => p && p.start).sort((a, b) => (a.start < b.start ? -1 : 1));
    out.logs = out.logs || {};
    return out;
  }
  function cacheLoad() {
    try { const raw = localStorage.getItem(KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) {}
    return emptyData();
  }
  function cacheSave() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
  function setDirty(v) { try { v ? localStorage.setItem(KEY + ':dirty', '1') : localStorage.removeItem(KEY + ':dirty'); } catch (e) {} }
  function isDirty() { try { return localStorage.getItem(KEY + ':dirty') === '1'; } catch (e) { return false; } }

  const cfg = window.QUADERNO_CONFIG || {};
  const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, { auth: { storageKey: 'ciclo-kendra-auth' } });
  let userId = null;
  let userEmail = '';
  let data = cacheLoad();
  let loaded = false;
  let loadError = false;
  let undoState = null;
  let pushTimer = null;
  let syncState = 'ok';
  const st = { tab: 'oggi', month: monthStart(todayIso()), symDay: todayIso() };

  function setSync(s) {
    syncState = s;
    const el = $('sync');
    if (el) { el.dataset.s = s; el.textContent = { ok: 'Sincronizzato', saving: 'Salvataggio…', error: 'Non salvato online' }[s]; }
  }
  async function pull() {
    if (!userId || isDirty()) return;
    const { data: row, error } = await sb.from(TABLE).select('data').eq('user_id', userId).maybeSingle();
    if (error) { loadError = !data.periods.length; setSync('error'); render(); return; }
    loaded = true; loadError = false;
    if (row) { data = normalize(row.data); cacheSave(); }
    setSync('ok');
    render();
  }
  async function push() {
    if (!userId) return;
    clearTimeout(pushTimer);
    const { error } = await sb.from(TABLE).upsert({ user_id: userId, data, updated_at: new Date().toISOString() });
    if (error) { setSync('error'); return; }
    setDirty(false); setSync('ok');
  }
  function save() {
    cacheSave(); setDirty(true); setSync('saving');
    clearTimeout(pushTimer);
    pushTimer = setTimeout(push, 500);
  }
  function snapshot() { undoState = JSON.stringify(data); }
  function commit(msg, undo) { save(); render(); if (msg) toast(msg, undo); }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { isDirty() ? push() : pull(); } });

  // ---------- il modello del ciclo ----------
  // La data prevista dipende solo dai cicli registrati: finché non segni l'inizio di un nuovo ciclo
  // resta ferma, e dal giorno dopo l'app conta il ritardo.
  function model(today) {
    const per = data.periods;
    if (!per.length) return null;
    const starts = per.map((p) => p.start);
    const lens = [];
    for (let i = 1; i < starts.length; i++) { const d = diff(starts[i - 1], starts[i]); if (d >= 15 && d <= 90) lens.push(d); }
    const recent = lens.slice(-6);
    const cyc = recent.length ? Math.round(avg(recent)) : data.baseCycle;
    const plens = per.filter((p) => p.end).map((p) => diff(p.start, p.end) + 1).filter((x) => x >= 1 && x <= 15).slice(-6);
    const flow = plens.length ? Math.round(avg(plens)) : data.basePeriod;
    const endOf = (p) => p.end || addDays(p.start, flow - 1);
    const last = per[per.length - 1];
    const expected = addDays(last.start, cyc);
    const cycleDay = diff(last.start, today) + 1;
    const delay = today > expected ? diff(expected, today) : 0;
    const ongoing = today >= last.start && today <= endOf(last) && (!last.end || today <= last.end);
    const preds = [];
    for (let k = 0; k < 13; k++) preds.push(addDays(expected, k * cyc));

    // Mappa giorno per giorno: ciclo vero, ciclo previsto, giorni fertili, ovulazione.
    const map = new Map();
    const set = (d, t) => { const cur = map.get(d); const rank = { per: 4, pred: 3, ovu: 2, fert: 1 }; if (!cur || rank[t] > rank[cur]) map.set(d, t); };
    per.forEach((p) => { for (let d = p.start; d <= endOf(p); d = addDays(d, 1)) set(d, 'per'); });
    preds.forEach((s) => { for (let i = 0; i < flow; i++) set(addDays(s, i), 'pred'); });
    const allStarts = [...starts, ...preds];
    const ovus = [];
    for (let i = 1; i < allStarts.length; i++) {
      const ovu = addDays(allStarts[i], -14);
      if (ovu <= endOf({ start: allStarts[i - 1] })) continue;
      ovus.push({ ovu, from: addDays(ovu, -5), to: addDays(ovu, 1), next: allStarts[i] });
      for (let d = addDays(ovu, -5); d <= addDays(ovu, 1); d = addDays(d, 1)) set(d, 'fert');
      set(ovu, 'ovu');
    }
    const cur = ovus.find((o) => o.next === expected) || null;
    const nextOvu = ovus.find((o) => o.ovu >= today) || null;
    return { cyc, flow, lens, recent, plens, last, expected, cycleDay, delay, ongoing, preds, map, ovus, cur, nextOvu, endOf, starts, today };
  }

  function phaseOf(m, d) {
    const t = m.map.get(d);
    if (t === 'per') return 'mestruale';
    if (d > m.expected && d <= m.today) return 'ritardo';
    if (t === 'ovu') return 'ovulazione';
    if (t === 'fert') return 'fertile';
    const next = m.starts.concat(m.preds).find((s) => s > d);
    if (next && diff(d, next) <= 5) return 'premestruale';
    const o = m.ovus.find((x) => x.next === next);
    if (o && d < o.from) return 'follicolare';
    return 'luteale';
  }

  // Consiglio che cambia ogni giorno ma resta uguale per tutta la giornata.
  const daily = (arr, d, salt = 0) => arr[(utc(d) / 86400000 + salt) % arr.length];

  // ---------- render ----------
  function render() {
    const tabs = $('tabs');
    tabs.querySelectorAll('.tab').forEach((n) => n.remove());
    const hasData = data.periods.length > 0;
    if (hasData) TABS.forEach(([k, label]) => {
      const b = document.createElement('button');
      b.className = 'tab'; b.dataset.tab = k;
      if (st.tab === k) b.setAttribute('aria-current', 'page');
      b.innerHTML = svg(ICON[k]) + `<span>${label}</span>`;
      tabs.appendChild(b);
    });
    tabs.hidden = !hasData;
    $('app').style.paddingBottom = hasData ? '' : '0';
    const today = todayIso();
    let html;
    if (!hasData) html = loadError ? '<section class="panel"><p>Non riesco a caricare i tuoi dati. Controlla la connessione.</p><button class="btn" data-act="retry">Riprova</button></section>' : loaded ? viewSetup() : '<p class="empty">Carico i tuoi dati…</p>';
    else {
      const m = model(today);
      html = ({ oggi: viewOggi, calendario: viewCal, sintomi: viewSintomi, consigli: viewConsigli, opzioni: viewOpzioni })[st.tab](m, today);
    }
    $('view').innerHTML = html;
    setSync(syncState);
  }

  function header(title, sub, extra = '') {
    return `<div class="top"><h1>${title}${sub ? `<small>${sub}</small>` : ''}</h1>${extra}</div>`;
  }

  function viewSetup() {
    const t = todayIso();
    return `${header('Benvenuta Kendra', 'Iniziamo dal tuo ultimo ciclo')}
      <form class="panel" id="f-setup">
        <h2>Quando è iniziato il tuo ultimo ciclo?</h2>
        <p class="small">Segna il primo giorno di flusso. Da qui l'app calcola da sola i prossimi cicli, l'ovulazione e i giorni fertili.</p>
        <div class="field"><label for="s-start">Primo giorno dell'ultimo ciclo</label><input id="s-start" type="date" max="${t}" value="${addDays(t, -14)}" required></div>
        <div class="grid2">
          <div class="field"><label for="s-cyc">Durata del ciclo (giorni)</label><input id="s-cyc" type="number" inputmode="numeric" min="18" max="60" value="${data.baseCycle}" required></div>
          <div class="field"><label for="s-flow">Giorni di flusso</label><input id="s-flow" type="number" inputmode="numeric" min="1" max="12" value="${data.basePeriod}" required></div>
        </div>
        <p class="small">Il ciclo irregolare va benissimo: partiamo da 28 giorni e ogni volta che segni un nuovo ciclo l'app usa la tua media vera.</p>
        <button class="btn block">Inizia</button>
      </form>`;
  }

  function ring(m) {
    const L = Math.max(m.cyc, m.cycleDay);
    const R = 92, C = 2 * Math.PI * R;
    const arc = (from, to, color, w) => {
      if (to < 1 || from > L) return '';
      from = Math.max(1, from); to = Math.min(L, to);
      const len = (C * (to - from + 1)) / L;
      return `<circle cx="110" cy="110" r="${R}" fill="none" stroke="${color}" stroke-width="${w}" stroke-dasharray="${len} ${C}" stroke-dashoffset="${(-C * (from - 1)) / L}"/>`;
    };
    const pos = (i) => { const a = ((i - 0.5) / L) * 2 * Math.PI; return [110 + R * Math.cos(a), 110 + R * Math.sin(a)]; };
    const idx = (d) => diff(m.last.start, d) + 1;
    let s = arc(1, L, 'var(--chip)', 16);
    if (m.cur) s += arc(idx(m.cur.from), idx(m.cur.to), 'var(--fert-soft)', 16);
    s += arc(1, idx(m.endOf(m.last)), 'var(--period)', 16);
    if (m.cycleDay > m.cyc) s += arc(m.cyc + 1, m.cycleDay, 'var(--late)', 8);
    if (m.cur) { const [x, y] = pos(idx(m.cur.ovu)); s += `<circle cx="${x}" cy="${y}" r="7" fill="var(--accent)"/>`; }
    const [tx, ty] = pos(Math.min(m.cycleDay, L));
    s += `<circle cx="${tx}" cy="${ty}" r="10" fill="var(--surface)" stroke="var(--fg)" stroke-width="3"/>`;

    let lab, big, sub, cls = '';
    if (m.ongoing) { lab = 'Ciclo in corso'; big = `Giorno ${m.cycleDay}`; sub = m.last.end ? `finisce il ${fmtDM(m.last.end)}` : `finisce verso il ${fmtDM(m.endOf(m.last))}`; cls = 'per'; }
    else if (m.delay > 0) { lab = 'Ritardo'; big = giorni(m.delay); sub = `previsto il ${fmtDM(m.expected)}`; cls = 'late'; }
    else if (m.today === m.expected) { lab = 'Ciclo previsto'; big = 'Oggi'; sub = fmtDM(m.expected); cls = 'per'; }
    else { const n = diff(m.today, m.expected); lab = 'Prossimo ciclo tra'; big = giorni(n); sub = `previsto il ${fmtDM(m.expected)}`; }
    return `<div class="ring"><svg viewBox="0 0 220 220" role="img" aria-label="${esc(lab + ' ' + big + ', ' + sub)}"><g transform="rotate(-90 110 110)">${s}</g></svg>
      <div class="in"><span class="lab">${lab}</span><span class="big ${cls}">${big}</span><span class="sub">${sub}</span></div></div>`;
  }

  function tipsFor(log, d) {
    const out = [];
    (log && log.sym || []).forEach((k, i) => { const s = SINTOMI[k]; if (s) out.push({ t: 'Per ' + s.label.toLowerCase(), p: daily(s.tips, d, i), doc: s.doc }); });
    if (log && log.mood && UMORI[log.mood]) out.push({ t: 'Umore: ' + UMORI[log.mood].label.toLowerCase(), p: UMORI[log.mood].tip });
    return out;
  }
  const tipHtml = (x) => `<div class="tip"><h3>${esc(x.t)}</h3><p>${esc(x.p)}</p>${x.doc ? `<p class="doc">${esc(x.doc)}</p>` : ''}</div>`;

  function unprotectedThisCycle(m) {
    return Object.entries(data.logs).some(([d, l]) => d >= addDays(m.last.start, -3) && l.sex === 'non_protetto');
  }

  function viewOggi(m, today) {
    const ph = phaseOf(m, today);
    const F = FASI[ph];
    const pillCls = F.cls;
    const range = m.recent.length >= 2 ? `di solito tra ${Math.min(...m.recent)} e ${Math.max(...m.recent)} giorni` : '';
    const based = m.recent.length ? `media di ${m.recent.length} ${m.recent.length === 1 ? 'ciclo' : 'cicli'}` : 'valore di partenza';
    const btn = m.ongoing && !m.last.end
      ? `<div class="actions"><button class="btn violet" data-act="fine">Il ciclo è finito</button><button class="btn ghost" data-act="arrivato">Correggi l'inizio</button></div>`
      : `<button class="btn block" data-act="arrivato">Mi è arrivato il ciclo</button>`;
    let note = '';
    if (m.delay > 0) {
      const unp = unprotectedThisCycle(m);
      note = `<div class="note"><p><b>Il ciclo è in ritardo di ${giorni(m.delay)}.</b> Era previsto per ${fmtLong(m.expected)} e la data resta quella: quando arriva, premi il bottone qui sopra.</p>
        ${unp ? '<p>In questo ciclo hai segnato un rapporto non protetto: dal primo giorno di ritardo un test di gravidanza è già affidabile. Se è negativo e il ciclo non arriva, ripetilo dopo qualche giorno.</p>' : ''}
        ${m.delay >= 30 ? '<p>È passato più di un mese dalla data prevista: parlane con la ginecologa.</p>' : ''}</div>`;
    }
    const log = data.logs[today];
    const tips = tipsFor(log, today);
    const tip = tips.length ? tips[0] : { t: F.nome, p: daily(F.tips, today) };
    const nextOvu = m.nextOvu;
    return `${header('Ciao Kendra', cap(fmtLong(today)))}
      <section class="panel hero">${ring(m)}
        <span class="pill ${pillCls}">Giorno ${m.cycleDay} del ciclo · ${F.nome}</span>
        <div style="width:100%;display:grid;gap:8px">${btn}</div>
      </section>
      ${note}
      <section class="panel">
        <dl class="facts">
          <div><dt>Prossimo ciclo</dt><dd>${cap(fmtWDM(m.expected))}${m.delay ? `<small>ritardo di ${giorni(m.delay)}</small>` : ''}</dd></div>
          ${nextOvu ? `<div><dt>Ovulazione</dt><dd>${cap(fmtWDM(nextOvu.ovu))}<small>giorni fertili ${fmtDMs(nextOvu.from)} – ${fmtDMs(nextOvu.to)}</small></dd></div>` : ''}
          <div><dt>Durata del ciclo</dt><dd>${giorni(m.cyc)}<small>${based}${range ? ', ' + range : ''}</small></dd></div>
          <div><dt>Durata del flusso</dt><dd>${giorni(m.flow)}<small>${m.plens.length ? `media di ${m.plens.length} ${m.plens.length === 1 ? 'ciclo' : 'cicli'}` : 'valore di partenza'}</small></dd></div>
        </dl>
      </section>
      <section class="panel">
        <p class="label">Consiglio di oggi</p>
        ${tipHtml(tip)}
        <button class="linkbtn" data-go="sintomi" data-day="${today}">${log ? 'Modifica come ti senti oggi' : 'Segna come ti senti oggi'}</button>
      </section>`;
  }

  function viewCal(m, today) {
    const first = st.month;
    const off = (parse(first).getDay() + 6) % 7;
    let cells = ['L', 'M', 'M', 'G', 'V', 'S', 'D'].map((x) => `<span class="dow">${x}</span>`).join('');
    for (let i = 0; i < off; i++) cells += '<span></span>';
    for (let d = first; d.slice(0, 7) === first.slice(0, 7); d = addDays(d, 1)) {
      const t = m.map.get(d) || '';
      const c = [t, d === today ? 'today' : '', d > today ? 'future' : ''].join(' ');
      const badge = d === m.expected && m.delay > 0 ? `<span class="badge">+${m.delay}</span>` : '';
      const lab = { per: 'ciclo', pred: 'ciclo previsto', fert: 'giorno fertile', ovu: 'ovulazione' }[t] || '';
      cells += `<button class="d ${c}" data-day="${d}" aria-label="${esc(fmtLong(d) + (lab ? ', ' + lab : ''))}">${Number(d.slice(8))}${data.logs[d] ? '<i class="dot"></i>' : ''}${badge}</button>`;
    }
    // Riepilogo del mese mostrato.
    const ym = first.slice(0, 7);
    const items = [];
    data.periods.forEach((p) => { if (p.start.slice(0, 7) === ym || m.endOf(p).slice(0, 7) === ym) items.push([p.start, `Ciclo dal ${fmtDMs(p.start)} al ${fmtDMs(m.endOf(p))}`, p.end ? '' : 'fine stimata', 'var(--period)']); });
    m.preds.forEach((s, i) => { if (s.slice(0, 7) === ym) items.push([s, `Ciclo previsto il ${fmtDMs(s)}`, i === 0 && m.delay ? `in ritardo di ${giorni(m.delay)}` : '', 'var(--period-soft)']); });
    m.ovus.forEach((o) => { if (o.ovu.slice(0, 7) === ym) items.push([o.ovu, `Ovulazione il ${fmtDMs(o.ovu)}`, `giorni fertili ${fmtDMs(o.from)} – ${fmtDMs(o.to)}`, 'var(--accent)']); });
    items.sort((a, b) => (a[0] < b[0] ? -1 : 1));
    const isNow = first === monthStart(today);
    return `${header('Calendario', 'Tocca un giorno per segnarlo')}
      <section class="panel">
        <div class="monthbar"><button class="iconbtn" data-month="-1" aria-label="Mese precedente">${PREV}</button><h2>${fmtMonth(first)}</h2>
          ${isNow ? '' : '<button class="todaybtn" data-month="0">Oggi</button>'}<button class="iconbtn" data-month="1" aria-label="Mese successivo">${NEXT}</button></div>
        <div class="cal">${cells}</div>
        <div class="legend">
          <span><i style="background:var(--period)"></i>Ciclo</span>
          <span><i style="box-shadow:inset 0 0 0 2px var(--period)"></i>Ciclo previsto</span>
          <span><i style="background:var(--fert-soft);box-shadow:inset 0 0 0 1px var(--accent)"></i>Giorni fertili</span>
          <span><i style="background:var(--accent)"></i>Ovulazione</span>
          <span><i style="background:var(--fg);opacity:.55;width:6px;height:6px"></i>Sintomi segnati</span>
        </div>
      </section>
      <section class="panel"><h2>${fmtMonth(first).split(' ')[0]}</h2>
        ${items.length ? `<ul class="list">${items.map(([, a, b, c]) => `<li class="row"><i class="sw" style="background:${c}"></i><span class="txt">${a}${b ? `<small>${b}</small>` : ''}</span></li>`).join('')}</ul>` : '<p class="empty">Niente da segnalare in questo mese.</p>'}
      </section>
      <section class="panel"><h2>Prossimi cicli</h2>
        <ul class="list">${m.preds.slice(0, 4).map((s, i) => `<li class="row"><span class="txt">${cap(fmtWDM(s))}${i === 0 && m.delay ? `<small>in ritardo di ${giorni(m.delay)}</small>` : ''}</span><span class="val">${i === 0 ? (s === today ? 'oggi' : s > today ? 'tra ' + giorni(diff(today, s)) : '') : ''}</span></li>`).join('')}</ul>
        <p class="small">Le date previste usano la durata media dei tuoi cicli (${giorni(m.cyc)}) e non si spostano da sole.</p>
      </section>`;
  }

  function viewSintomi(m, today) {
    const d = st.symDay;
    const log = data.logs[d] || {};
    const sym = log.sym || [];
    const chips = Object.entries(SINTOMI).map(([k, s]) => `<button class="chip" data-sym="${k}" aria-pressed="${sym.includes(k)}">${s.label}</button>`).join('');
    const moods = Object.entries(UMORI).map(([k, u]) => `<button data-mood="${k}" aria-pressed="${log.mood === k}">${u.label}</button>`).join('');
    const flows = FLUSSI.map(([k, l]) => `<button data-flow="${k}" aria-pressed="${(log.flow || '') === k}">${l}</button>`).join('');
    const sexes = RAPPORTI.map(([k, l]) => `<button data-sex="${k}" aria-pressed="${(log.sex || '') === k}">${l}</button>`).join('');
    const inPeriod = m.map.get(d) === 'per';
    const flowHint = log.flow && log.flow !== 'spotting' && !inPeriod && d <= today
      ? `<div class="note"><p>Hai segnato flusso ${log.flow} ma questo giorno non è nel ciclo.</p><button class="btn" data-act="start-here" data-day="${d}">Segna l'inizio del ciclo il ${fmtDM(d)}</button></div>` : '';
    const tips = tipsFor(log, d);
    const rel = d === today ? 'Oggi' : d === addDays(today, -1) ? 'Ieri' : cap(fmtLong(d));
    const recent = Object.keys(data.logs).filter((x) => x !== d && x <= today).sort().reverse().slice(0, 5);
    return `<div class="top"><button class="iconbtn" data-symday="-1" aria-label="Giorno precedente">${PREV}</button>
        <h1 style="text-align:center">${rel}<small>${d === today ? cap(fmtLong(d)) : 'Come stavi?'}</small></h1>
        <button class="iconbtn" data-symday="1" aria-label="Giorno successivo" ${d >= today ? 'disabled' : ''}>${NEXT}</button></div>
      ${d !== today ? '<button class="todaybtn" data-symday="0" style="justify-self:center">Torna a oggi</button>' : ''}
      <section class="panel"><p class="label">Sintomi</p><div class="chips">${chips}</div></section>
      <section class="panel"><p class="label">Umore</p><div class="seg">${moods}</div></section>
      <section class="panel"><p class="label">Flusso</p><div class="seg">${flows}</div>${flowHint}</section>
      <section class="panel"><p class="label">Altro</p>
        <div><p class="small" style="margin-bottom:6px">Rapporti</p><div class="seg">${sexes}</div></div>
        ${data.pillola ? `<div class="toggle"><span>Pillola presa</span><button class="switch" role="switch" data-pill aria-checked="${!!log.pill}" aria-label="Pillola presa"></button></div>` : ''}
        <div class="grid2">
          <div class="field"><label for="x-weight">Peso (kg)</label><input id="x-weight" type="text" inputmode="decimal" value="${log.weight ? String(log.weight).replace('.', ',') : ''}" placeholder="es. 56,5"></div>
        </div>
        <div class="field"><label for="x-note">Note</label><textarea id="x-note" placeholder="Come ti senti, cosa hai notato…">${esc(log.note || '')}</textarea></div>
      </section>
      <section class="panel"><h2>Consigli per ${d === today ? 'oggi' : 'questo giorno'}</h2>
        ${tips.length ? tips.map(tipHtml).join('') : '<p class="empty">Segna sintomi o umore e qui trovi i consigli giusti per te.</p>'}
      </section>
      ${recent.length ? `<section class="panel"><h2>Giorni segnati</h2><ul class="list">${recent.map((x) => {
        const l = data.logs[x];
        const parts = [...(l.sym || []).map((k) => SINTOMI[k] && SINTOMI[k].label), l.mood && UMORI[l.mood] && UMORI[l.mood].label, l.flow && 'flusso ' + l.flow].filter(Boolean);
        return `<li class="row"><span class="txt"><button class="linkbtn" data-symgo="${x}">${cap(fmtWDM(x))}</button><small>${esc(parts.join(', ') || (l.note ? 'nota' : '—'))}</small></span></li>`;
      }).join('')}</ul></section>` : ''}`;
  }

  function viewConsigli(m, today) {
    const ph = phaseOf(m, today);
    const F = FASI[ph];
    const log = data.logs[today];
    const tips = tipsFor(log, today);
    // Sintomi più frequenti negli ultimi 120 giorni e in che fase capitano di solito.
    const from = addDays(today, -120);
    const cnt = {}, where = {};
    Object.entries(data.logs).forEach(([d, l]) => {
      if (d < from || d > today) return;
      let p = phaseOf(m, d);
      p = p === 'ovulazione' ? 'fertile' : (p === 'follicolare' || p === 'luteale') ? 'altro' : p;
      (l.sym || []).forEach((k) => { cnt[k] = (cnt[k] || 0) + 1; where[k] = where[k] || {}; where[k][p] = (where[k][p] || 0) + 1; });
    });
    const top = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 6);
    const max = top.length ? top[0][1] : 1;
    const freq = top.map(([k, n]) => {
      const w = Object.entries(where[k]).sort((a, b) => b[1] - a[1])[0][0];
      return `<div><span>${SINTOMI[k].label}</span><span class="t"><i style="width:${Math.round((n / max) * 100)}%"></i></span><span class="num">${n}</span><small>di solito ${FASE_STAT[w]}</small></div>`;
    }).join('');
    return `${header('Consigli', 'Pensati per la fase in cui sei')}
      <section class="panel"><p class="label">Oggi · giorno ${m.cycleDay} del ciclo</p><h2>${F.nome}</h2>
        ${F.tips.map((t) => `<div class="tip"><p>${esc(t)}</p></div>`).join('')}
      </section>
      <section class="panel"><h2>Per come ti senti oggi</h2>
        ${tips.length ? tips.map(tipHtml).join('') : '<p class="empty">Oggi non hai ancora segnato sintomi.</p>'}
        <button class="linkbtn" data-go="sintomi" data-day="${today}">Segna i sintomi di oggi</button>
      </section>
      <section class="panel"><h2>Cosa ti capita più spesso <small>ultimi 4 mesi</small></h2>
        ${top.length ? `<div class="freq">${freq}</div>` : '<p class="empty">Quando avrai segnato qualche sintomo, qui vedrai quali ti capitano più spesso e in che giorni del ciclo.</p>'}
      </section>
      <section class="panel"><h2>Tutti i consigli</h2>
        <div>${Object.values(SINTOMI).map((s) => `<details class="lib"><summary>${s.label}</summary><ul>${s.tips.map((t) => `<li>${esc(t)}</li>`).join('')}${s.doc ? `<li style="color:var(--late)">${esc(s.doc)}</li>` : ''}</ul></details>`).join('')}</div>
      </section>
      <section class="note violet"><p><b>Quando sentire la ginecologa</b></p>
        <p>Questi consigli sono indicazioni generali e non sostituiscono il medico. Senti la ginecologa se hai dolori molto forti, un flusso così abbondante da cambiare assorbente ogni ora per più ore, perdite di sangue tra un ciclo e l'altro o dopo i rapporti, o se il ciclo non arriva da più di tre mesi.</p></section>`;
  }

  // ---------- notifiche ----------
  const rem = { device: false, checked: false };
  const pushOk = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  const b64u = (s) => { const b = atob((s + '='.repeat((4 - (s.length % 4)) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, (c) => c.charCodeAt(0)); };
  async function loadReminder() {
    try { if (pushOk()) { const reg = await navigator.serviceWorker.getRegistration(); rem.device = !!(reg && await reg.pushManager.getSubscription()); } } catch (e) {}
    rem.checked = true;
    if (st.tab === 'opzioni') render();
  }
  async function subscribe(reg) {
    const opts = { userVisibleOnly: true, applicationServerKey: b64u(cfg.vapidPublicKey) };
    const old = await reg.pushManager.getSubscription();
    if (old) return old;
    try { return await reg.pushManager.subscribe(opts); } catch (e) {
      try { const s = await reg.pushManager.getSubscription(); if (s) await s.unsubscribe(); } catch (x) {}
      await new Promise((r) => setTimeout(r, 1500));
      return await reg.pushManager.subscribe(opts);
    }
  }
  async function remOn() {
    try {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') { toast('Senza il permesso di Chrome non posso mandarti notifiche'); render(); return; }
      const reg = await navigator.serviceWorker.ready;
      const j = (await subscribe(reg)).toJSON();
      const r = await sb.from('dispositivi').upsert({ endpoint: j.endpoint, user_id: userId, subscription: j, app: APP });
      if (r.error) throw r.error;
      rem.device = true; render(); toast('Notifiche attivate su questo dispositivo');
    } catch (e) { toast(/push service/i.test(e.message || '') ? 'Il browser non riesce a contattare il servizio delle notifiche. Usa Chrome senza VPN o blocchi.' : 'Non sono riuscita ad attivarle: ' + (e.message || e)); }
  }
  async function remOff() {
    try {
      const reg = await navigator.serviceWorker.getRegistration();
      const sub = reg && await reg.pushManager.getSubscription();
      if (sub) { await sb.from('dispositivi').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
    } catch (e) {}
    rem.device = false; render(); toast('Notifiche spente su questo dispositivo');
  }
  async function remTest() {
    toast('Invio la notifica di prova…');
    const { data: res, error } = await sb.functions.invoke('promemoria', { body: { prova: true, app: APP } });
    if (error) toast('La prova non è partita, riprova più tardi.');
    else if (!res.inviate) toast('Nessuna notifica inviata' + (res.errori && res.errori.length ? ': ' + res.errori[0] : ''));
    else toast('Notifica di prova inviata');
  }

  function viewOpzioni(m) {
    const n = data.notifiche;
    let notif;
    if (!pushOk()) notif = '<p class="empty">Qui le notifiche non sono disponibili. Sul telefono apri l\'app dall\'icona installata con Chrome.</p>';
    else if (Notification.permission === 'denied') notif = '<p class="empty">Le notifiche sono bloccate. Riattivale in Chrome da Impostazioni sito › Notifiche, poi torna qui.</p>';
    else {
      const sw = (k, t, s) => `<div class="toggle"><span>${t}${s ? `<small>${s}</small>` : ''}</span><button class="switch" role="switch" data-notif="${k}" aria-checked="${!!n[k]}" aria-label="${esc(t)}"></button></div>`;
      notif = `<p class="small">${rem.device ? 'Attive su questo dispositivo.' : 'Spente su questo dispositivo.'} Le scelte qui sotto valgono per tutti i tuoi dispositivi.</p>
        <div class="actions">${rem.device ? '<button class="btn ghost" data-rem="off">Spegni qui</button><button class="btn violet" data-rem="test">Prova</button>' : '<button class="btn violet" data-rem="on">Attiva le notifiche</button>'}</div>
        <div>
          ${sw('prima', 'Due giorni prima del ciclo')}
          ${sw('giorno', 'Il giorno previsto')}
          ${sw('ritardo', 'Ogni giorno di ritardo', 'Ti dice di quanti giorni sei in ritardo')}
          ${sw('fine', 'Quando il ciclo dovrebbe finire', 'Ti chiede se è finito, per la media del flusso')}
          ${sw('fertile', 'Inizio dei giorni fertili')}
          ${sw('ovulazione', 'Giorno dell\'ovulazione')}
          ${sw('sintomi', 'Promemoria per i sintomi', 'Solo se quel giorno non hai segnato niente')}
        </div>
        <p class="label">Ora degli avvisi del ciclo</p>
        <div class="hours">${[7, 8, 9, 10, 11, 12].map((h) => `<button class="hour" data-ora="${h}" aria-pressed="${n.ora === h}">${h}:00</button>`).join('')}</div>
        ${n.sintomi ? `<p class="label">Ora del promemoria sintomi</p><div class="hours">${[18, 19, 20, 21, 22, 23].map((h) => `<button class="hour" data-orasint="${h}" aria-pressed="${n.oraSintomi === h}">${h}:00</button>`).join('')}</div>` : ''}`;
    }
    const hist = [...data.periods].reverse().map((p, i, arr) => {
      const prev = arr[i + 1];
      const len = prev ? diff(prev.start, p.start) : null;
      return `<li class="row"><span class="txt">${cap(fmtWDM(p.start))}<small>flusso ${p.end ? giorni(diff(p.start, p.end) + 1) : 'fine non segnata'}${len ? ` · ciclo di ${giorni(len)}` : ''}</small></span>
        <button class="del" data-delper="${p.id}" aria-label="Elimina il ciclo del ${fmtDM(p.start)}">${X}</button></li>`;
    }).join('');
    return `${header('Opzioni')}
      <section class="panel"><h2>Notifiche</h2>${notif}</section>
      <section class="panel"><h2>Il tuo ciclo</h2>
        <form id="f-base" class="grid2">
          <div class="field"><label for="b-cyc">Durata di partenza del ciclo</label><input id="b-cyc" type="number" inputmode="numeric" min="18" max="60" value="${data.baseCycle}"></div>
          <div class="field"><label for="b-flow">Giorni di flusso di partenza</label><input id="b-flow" type="number" inputmode="numeric" min="1" max="12" value="${data.basePeriod}"></div>
          <button class="btn ghost">Salva</button>
        </form>
        <p class="small">Valgono finché non ci sono abbastanza cicli segnati. Ora l'app usa ${giorni(m.cyc)} di ciclo e ${giorni(m.flow)} di flusso.</p>
        <div class="toggle"><span>Prendo la pillola<small>Aggiunge "pillola presa" nei sintomi</small></span><button class="switch" role="switch" data-pillola aria-checked="${!!data.pillola}" aria-label="Prendo la pillola"></button></div>
      </section>
      <section class="panel"><h2>Storico dei cicli <small>${data.periods.length}</small></h2><ul class="list">${hist}</ul></section>
      <section class="panel"><div class="actions" style="justify-content:space-between;align-items:center"><span class="small">${esc(userEmail)}</span><span class="sync" id="sync"></span></div>
        <button class="linkbtn" data-logout>Esci</button></section>`;
  }

  // ---------- fogli (scelte rapide) ----------
  function openSheet(html) { $('sheetbox').innerHTML = html; $('sheet').hidden = false; const f = $('sheetbox').querySelector('button, input'); if (f) f.focus(); }
  function closeSheet() { $('sheet').hidden = true; $('sheetbox').innerHTML = ''; }
  function sheetArrivato() {
    const t = todayIso();
    openSheet(`<h3>Quando è arrivato?</h3>
      <div class="actions"><button class="btn" data-start="${t}">Oggi</button><button class="btn ghost" data-start="${addDays(t, -1)}">Ieri</button></div>
      <form id="f-start" class="grid2" style="align-items:end"><div class="field"><label for="a-day">Un altro giorno</label><input id="a-day" type="date" max="${t}" value="${addDays(t, -2)}"></div><button class="btn ghost">Segna</button></form>
      <button class="linkbtn" data-close>Annulla</button>`);
  }
  function sheetFine() {
    const t = todayIso();
    openSheet(`<h3>Quando è finito?</h3>
      <div class="actions"><button class="btn violet" data-end="${t}">Oggi</button><button class="btn ghost" data-end="${addDays(t, -1)}">Ieri</button></div>
      <button class="linkbtn" data-close>Annulla</button>`);
  }
  function sheetDay(d) {
    const m = model(todayIso());
    const t = todayIso();
    const type = m.map.get(d);
    const ph = phaseOf(m, d);
    const p = [...data.periods].reverse().find((x) => x.start <= d);
    const inReal = p && d <= m.endOf(p);
    const isStart = p && p.start === d;
    const canEnd = p && d > p.start && diff(p.start, d) < 15 && !data.periods.some((x) => x.start > p.start && x.start <= d) && d <= t;
    const tags = [];
    if (type === 'per') tags.push('<span class="pill per">Ciclo</span>');
    if (type === 'pred') tags.push(`<span class="pill per">Ciclo previsto</span>`);
    if (d === m.expected && m.delay) tags.push(`<span class="pill late">In ritardo di ${giorni(m.delay)}</span>`);
    if (type === 'ovu') tags.push('<span class="pill fert">Ovulazione stimata</span>');
    if (type === 'fert') tags.push('<span class="pill fert">Giorno fertile</span>');
    if (!type && FASI[ph]) tags.push(`<span class="pill">${FASI[ph].nome}</span>`);
    const log = data.logs[d];
    const acts = [];
    if (d <= t && !inReal) acts.push(`<button class="btn" data-start="${d}">È iniziato il ciclo questo giorno</button>`);
    if (canEnd) acts.push(`<button class="btn violet" data-end="${d}">Il ciclo è finito questo giorno</button>`);
    if (isStart) acts.push(`<button class="btn ghost" data-delper="${p.id}">Togli questo ciclo</button>`);
    if (d <= t) acts.push(`<button class="btn ghost" data-go="sintomi" data-day="${d}">${log ? 'Vedi o modifica i sintomi' : 'Segna i sintomi'}</button>`);
    openSheet(`<h3>${cap(fmtLong(d))}</h3><div class="status">${tags.join('')}</div>
      ${log && (log.sym || []).length ? `<p class="small">${log.sym.map((k) => SINTOMI[k] && SINTOMI[k].label).filter(Boolean).join(', ')}</p>` : ''}
      ${d > t ? '<p class="small">Questo giorno è nel futuro: quello che vedi è una previsione.</p>' : ''}
      <div style="display:grid;gap:8px">${acts.join('')}</div>
      <button class="linkbtn" data-close>Chiudi</button>`);
  }

  // ---------- azioni sui cicli ----------
  function addStart(d) {
    snapshot();
    const near = data.periods.find((p) => Math.abs(diff(p.start, d)) < 10);
    let msg;
    if (near) { near.start = d; if (near.end && near.end < d) delete near.end; msg = `Inizio del ciclo spostato al ${fmtDM(d)}`; }
    else { data.periods.push({ id: uid(), start: d }); msg = `Ciclo segnato dal ${fmtDM(d)}`; }
    data.periods.sort((a, b) => (a.start < b.start ? -1 : 1));
    closeSheet();
    commit(msg, true);
  }
  function setEnd(d) {
    const p = [...data.periods].reverse().find((x) => x.start <= d);
    if (!p) return;
    snapshot();
    p.end = d;
    closeSheet();
    commit(`Fine del ciclo segnata il ${fmtDM(d)}`, true);
  }
  function delPeriod(id) {
    snapshot();
    data.periods = data.periods.filter((p) => p.id !== id);
    closeSheet();
    commit('Ciclo eliminato', true);
  }
  function logFor(d) { if (!data.logs[d]) data.logs[d] = {}; return data.logs[d]; }
  function cleanLog(d) {
    const l = data.logs[d]; if (!l) return;
    if (!(l.sym && l.sym.length) && !l.mood && !l.flow && !l.sex && !l.pill && !l.weight && !l.note) delete data.logs[d];
  }

  function toast(msg, undo) {
    if (!undo) undoState = null;
    $('undo').hidden = !undo;
    $('toastmsg').textContent = msg;
    $('toast').hidden = false;
    clearTimeout(toast.t);
    toast.t = setTimeout(() => { $('toast').hidden = true; }, 5000);
  }
  $('undo').addEventListener('click', () => {
    if (!undoState) return;
    data = normalize(JSON.parse(undoState)); undoState = null;
    $('toast').hidden = true; save(); render();
  });

  // ---------- eventi ----------
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && !$('sheet').hidden) closeSheet(); });
  $('sheet').addEventListener('click', (ev) => { if (ev.target === $('sheet')) closeSheet(); });
  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('button');
    if (!el) return;
    const ds = el.dataset;
    if (ds.tab) { st.tab = ds.tab; if (ds.tab === 'sintomi') st.symDay = todayIso(); if (ds.tab === 'opzioni' && !rem.checked) loadReminder(); render(); window.scrollTo(0, 0); return; }
    if ('close' in ds) { closeSheet(); return; }
    if (ds.act === 'retry') { pull(); return; }
    if (ds.act === 'arrivato') { sheetArrivato(); return; }
    if (ds.act === 'fine') { sheetFine(); return; }
    if (ds.act === 'start-here') { addStart(ds.day); return; }
    if (ds.start) { addStart(ds.start); return; }
    if (ds.end) { setEnd(ds.end); return; }
    if (ds.delper) { delPeriod(ds.delper); return; }
    if (ds.go) { closeSheet(); st.tab = ds.go; if (ds.day) st.symDay = ds.day; render(); window.scrollTo(0, 0); return; }
    if (ds.month) { st.month = ds.month === '0' ? monthStart(todayIso()) : addMonths(st.month, Number(ds.month)); render(); return; }
    if (el.classList.contains('d') && ds.day) { sheetDay(ds.day); return; }
    if (ds.symday) {
      const t = todayIso();
      st.symDay = ds.symday === '0' ? t : addDays(st.symDay, Number(ds.symday));
      if (st.symDay > t) st.symDay = t;
      render(); return;
    }
    if (ds.symgo) { st.symDay = ds.symgo; render(); window.scrollTo(0, 0); return; }
    if (ds.sym) { const l = logFor(st.symDay); l.sym = l.sym || []; l.sym = l.sym.includes(ds.sym) ? l.sym.filter((x) => x !== ds.sym) : [...l.sym, ds.sym]; cleanLog(st.symDay); commit(); return; }
    if (ds.mood !== undefined && 'mood' in ds) { const l = logFor(st.symDay); l.mood = l.mood === ds.mood ? '' : ds.mood; cleanLog(st.symDay); commit(); return; }
    if ('flow' in ds) { const l = logFor(st.symDay); l.flow = ds.flow; cleanLog(st.symDay); commit(); return; }
    if ('sex' in ds) { const l = logFor(st.symDay); l.sex = ds.sex; cleanLog(st.symDay); commit(); return; }
    if ('pill' in ds) { const l = logFor(st.symDay); l.pill = !l.pill; cleanLog(st.symDay); commit(); return; }
    if ('pillola' in ds) { data.pillola = !data.pillola; commit(); return; }
    if (ds.notif) { data.notifiche[ds.notif] = !data.notifiche[ds.notif]; commit(); return; }
    if (ds.ora) { data.notifiche.ora = Number(ds.ora); commit(`Avvisi del ciclo alle ${ds.ora}:00`); return; }
    if (ds.orasint) { data.notifiche.oraSintomi = Number(ds.orasint); commit(`Promemoria sintomi alle ${ds.orasint}:00`); return; }
    if (ds.rem) { ({ on: remOn, off: remOff, test: remTest })[ds.rem](); return; }
    if ('logout' in ds) { (isDirty() ? push() : Promise.resolve()).then(() => sb.auth.signOut()); return; }
  });
  // Peso e note si salvano mentre scrivi, senza ridisegnare la pagina.
  document.addEventListener('input', (ev) => {
    const id = ev.target.id;
    if (id !== 'x-weight' && id !== 'x-note') return;
    const l = logFor(st.symDay);
    if (id === 'x-note') l.note = ev.target.value;
    else { const n = parseFloat(ev.target.value.replace(',', '.')); l.weight = isFinite(n) && n > 0 ? n : null; }
    cleanLog(st.symDay); save();
  });

  document.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const f = ev.target.id;
    const int = (id, lo, hi) => { const n = parseInt($(id).value, 10); return isFinite(n) ? Math.min(hi, Math.max(lo, n)) : null; };
    if (f === 'f-setup') {
      const d = $('s-start').value; if (!d || d > todayIso()) return;
      data.baseCycle = int('s-cyc', 18, 60) || 28;
      data.basePeriod = int('s-flow', 1, 12) || 5;
      data.periods = [{ id: uid(), start: d }];
      st.tab = 'oggi';
      commit('Fatto! Ecco le tue previsioni');
    } else if (f === 'f-start') {
      const d = $('a-day').value; if (!d || d > todayIso()) return;
      addStart(d);
    } else if (f === 'f-base') {
      data.baseCycle = int('b-cyc', 18, 60) || data.baseCycle;
      data.basePeriod = int('b-flow', 1, 12) || data.basePeriod;
      commit('Salvato');
    }
  });

  $('f-login').addEventListener('submit', async (ev) => {
    ev.preventDefault(); ev.stopPropagation();
    const err = $('l-err'); err.hidden = true; $('l-btn').disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: $('l-email').value.trim(), password: $('l-pass').value });
    $('l-btn').disabled = false;
    if (error) { err.textContent = 'Email o password non corrette.'; err.hidden = false; }
  });

  function showApp(session) {
    const was = userId;
    userId = session ? session.user.id : null;
    userEmail = session ? session.user.email || '' : '';
    $('login').hidden = !!session;
    $('app').hidden = !session;
    if (!session) {
      if (was) { data = emptyData(); loaded = false; try { localStorage.removeItem(KEY); localStorage.removeItem(KEY + ':dirty'); } catch (e) {} }
      return;
    }
    if (was === userId) return;
    loaded = data.periods.length > 0;
    render();
    if (isDirty()) push(); else pull();
    loadReminder();
  }
  // Se l'app resta aperta oltre mezzanotte, ridisegna così il ritardo è sempre aggiornato.
  let lastDay = todayIso();
  setInterval(() => { if (todayIso() !== lastDay) { lastDay = todayIso(); if (st.symDay > lastDay) st.symDay = lastDay; render(); } }, 60000);
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  sb.auth.onAuthStateChange((_event, session) => setTimeout(() => showApp(session), 0));
})();
</script>
